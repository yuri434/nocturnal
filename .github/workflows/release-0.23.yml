name: Publish Nocturnal 0.23
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0.23.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build.ps1
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /out:dist\Nocturnal-0.23.exe /win32icon:assets\nocturnal.ico /resource:dist\Nocturnal.exe,app /resource:assets\nocturnal.ico,icon /resource:assets\logo.png,photo /r:System.Windows.Forms.dll src\UpdateNocturnal.cs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Path package\dist,package\scripts -Force | Out-Null
          Copy-Item dist\Nocturnal.exe,dist\nocturnal.ico,dist\nocturnal.png package\dist
          Copy-Item scripts\install.ps1 package\scripts
          Copy-Item README.md package
          Compress-Archive -Path package\* -DestinationPath dist\Nocturnal-0.23.zip
          $files = @('dist\Nocturnal-0.23.exe','dist\Nocturnal-0.23.zip')
          $files | ForEach-Object { (Get-FileHash $_).Hash.ToLower() + '  ' + (Split-Path $_ -Leaf) } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          $notes = 'Novos downloads usam o título original do vídeo ou o nome informado pelo servidor. Clipes incluem o intervalo no nome, arquivos repetidos recebem um número e o nome continua editável na janela Salvar. Se não for possível recuperar o título, usa um nome baseado no link. Arquivos já baixados não são renomeados. Testados metadados de vídeo, cabeçalho de arquivo, acentos, nomes inválidos, colisões e cancelamento. Para atualizar, feche o Nocturnal e execute Nocturnal-0.23.exe. Para instalar pela primeira vez, use o ZIP e scripts/install.ps1. As ferramentas de mídia são obtidas separadamente, conforme o README. Os alertas da versão 0.21 continuam em investigação; esta versão não foi validada pelo VirusTotal.'
          gh release create v0.23.0 @files dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Nocturnal 0.23' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }


