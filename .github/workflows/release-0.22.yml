name: Publish Nocturnal 0.22
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0.22.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build.ps1
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /out:dist\Nocturnal-0.22.exe /win32icon:assets\nocturnal.ico /resource:dist\Nocturnal.exe,app /resource:assets\nocturnal.ico,icon /resource:assets\logo.png,photo /r:System.Windows.Forms.dll src\UpdateNocturnal.cs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Path package\dist,package\scripts -Force | Out-Null
          Copy-Item dist\Nocturnal.exe,dist\nocturnal.ico,dist\nocturnal.png package\dist
          Copy-Item scripts\install.ps1 package\scripts
          Copy-Item README.md package
          Compress-Archive -Path package\* -DestinationPath dist\Nocturnal-0.22.zip
          $files = @('dist\Nocturnal-0.22.exe','dist\Nocturnal-0.22.zip')
          $files | ForEach-Object { (Get-FileHash $_).Hash.ToLower() + '  ' + (Split-Path $_ -Leaf) } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          $notes = 'Escolha Vídeo MP4 ou Áudio MP3, marque Baixar somente um trecho e informe Início e Fim. Exemplo: 01:20 até 01:50 gera um clipe de 30 segundos. O intervalo é salvo na fila. O recorte depende do site e é indicado para vídeos gravados. Se não funcionar, o aplicativo informa a falha sem baixar o vídeo completo como alternativa automática. Testado com vídeo local: MP4 e MP3 de 2 a 5 segundos, ambos com duração de 3 segundos. Para atualizar ou reparar, feche o Nocturnal e execute Nocturnal-0.22.exe. Para uma instalação nova, use o ZIP e scripts/install.ps1. Requer ferramentas de mídia descritas no README. Os alertas de antivírus da versão 0.21 continuam em investigação; a versão 0.22 não foi validada pelo VirusTotal.'
          gh release create v0.22.0 @files dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Nocturnal 0.22' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }

