name: Publish Nocturnal 0.21
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0.21.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build.ps1
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /out:dist\Nocturnal-0.21.exe /win32icon:assets\nocturnal.ico /resource:dist\Nocturnal.exe,app /resource:assets\nocturnal.ico,icon /resource:assets\logo.png,photo /r:System.Windows.Forms.dll src\UpdateNocturnal.cs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Path package\dist,package\scripts -Force | Out-Null
          Copy-Item dist\Nocturnal.exe,dist\nocturnal.ico,dist\nocturnal.png package\dist
          Copy-Item scripts\install.ps1 package\scripts
          Copy-Item README.md package
          Compress-Archive -Path package\* -DestinationPath dist\Nocturnal-0.21.zip
          $files = @('dist\Nocturnal-0.21.exe','dist\Nocturnal-0.21.zip')
          $files | ForEach-Object { (Get-FileHash $_).Hash.ToLower() + '  ' + (Split-Path $_ -Leaf) } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          $notes = 'Corrige a instalação quando Nocturnal.exe está ausente. Preserva a fila e as ferramentas existentes e mantém Mostrar na pasta ao concluir. Para reparar, feche o aplicativo e execute Nocturnal-0.21.exe. Para instalar pela primeira vez, extraia Nocturnal-0.21.zip e execute scripts/install.ps1 no PowerShell. As ferramentas de mídia continuam sendo obtidas separadamente, conforme o README. Esta versão não altera o antivírus nem resolve por si só uma detecção; informe o nome da ameaça se houver um novo alerta.'
          gh release create v0.21.0 @files dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Nocturnal 0.21' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
